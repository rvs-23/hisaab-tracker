# Grayscale base only. Streamlit's theme is static per app, but the accents are
# per *person* (config.PROFILE_ACCENTS) — so native widgets (buttons, checkboxes,
# focus rings) stay a neutral slate and only charts/tiles carry the identity.
[theme]
base = "light"
primaryColor = "#475569"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f4f4"
textColor = "#1f1f1f"
font = "sans-serif"
